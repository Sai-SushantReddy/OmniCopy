services:
  api:
    build: .
    container_name: omnicopy-api
    
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      - postgres
      - redis
    volumes:
      - .:/app

  celery:
    build: .
    container_name: omnicopy-worker
    command: celery -A app.workers.tasks.celery_app worker --loglevel=info
    env_file:
      - .env
    depends_on:
      - postgres
      - redis
    volumes:
      - .:/app

  postgres:
    image: postgres:16
    container_name: omnicopy-postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: omnicopy
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: omnicopy-redis
    restart: always
    ports:
      - "6380:6379"

volumes:
  postgres_data: